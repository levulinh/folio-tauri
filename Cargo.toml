[workspace]
resolver = "2"
members = ["crates/folio-core", "crates/folio-app"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29", features = ["v7", "v4"] }
unicode-normalization = "0.1.26"
zstd = "0.14.3"
thiserror = "2.0.21"
chrono = "0.4.45"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
sha2 = "0.10"
tempfile = "3"
pretty_assertions = "1"
